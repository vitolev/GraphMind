# Graph Generation
num_graphs_per_iteration: 100000
generation_strategy: random
max_nodes: 8
max_depth: 1

gnn_model_type: gcn
data_format: Data

# GNN Configuration
gnn_hidden_dim: 64
gnn_num_layers: 3
gnn_num_heads: 8
gnn_dropout: 0.1
gnn_learning_rate: 0.001
gnn_batch_size: 32
gnn_epochs: 200
gnn_device: cuda

# Selection Strategy
top_k_to_keep: 1000
eval_k_best: 10

# Evaluation
num_eval_problems: 5
eval_timeout_seconds: 30
llm_model: gpt-4

# Pipeline Control
max_iterations: 3
checkpoint_frequency: 5

# Paths
save_dir: ./checkpoints
log_dir: ./logs
data_dir: ./data

# Experiment Info
experiment_name: gnn_multiagent_opt_v1
seed: 42
