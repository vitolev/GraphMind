# Graph Generation
num_graphs_per_iteration: 100000
generation_strategy: random
max_nodes: 7
max_depth: 2

gnn_model_type: gcn
data_format: Data

# GNN Configuration
gnn_hidden_dim: 64
gnn_num_layers: 3
gnn_num_heads: 8
gnn_dropout: 0.1
gnn_learning_rate: 0.001
gnn_batch_size: 32
gnn_epochs: 200
gnn_device: cuda

# Selection Strategy
top_k_to_keep: 20 # Number of graphs to keep after each iteration should be smaller in starting sets
eval_k_best: 4 # Number of graphs to evaluate after each iteration

# Evaluation
num_eval_problems: 4
eval_timeout_seconds: 30
#llm_model: gpt-4

# LLM Provider Configuration
# Options: "groq" (uses Groq API), "local" (uses HuggingFace transformers), or "ollama" (RECOMMENDED for speed)
llm_provider: groq
# For Ollama provider (FASTEST - ~0.5-2 seconds per call):
ollama_model: tinyllama  # FASTEST option (~0.3-0.5 sec/call, good enough for simple math)
# Other Ollama models (install with: ollama pull <model>):
# - "llama3.2" (~1-2 sec/call, excellent quality) - RECOMMENDED
# - "qwen2.5" (~1-2 sec/call, great math reasoning)
# - "gemma2" (~1-2 sec/call, good quality)
ollama_base_url: http://localhost:11434  # Default Ollama URL
# For local transformers provider (alternative):
local_llm_model: TinyLlama/TinyLlama-1.1B-Chat-v1.0  # ~0.5-1 sec/call, decent for simple math
local_llm_device: auto  # Options: "auto" (detects CUDA/MPS), "cuda", "mps" (Apple Silicon), "cpu"

# Pipeline Control
max_iterations: 10
checkpoint_frequency: 5

# Paths
save_dir: ./checkpoints
log_dir: ./logs
data_dir: ./data

# Experiment Info
experiment_name: gnn_multiagent_opt_v1
seed: 42
